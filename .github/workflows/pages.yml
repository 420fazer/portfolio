name: Publish portfolio and preview
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - uses: actions/checkout@v4
        with:
          ref: develop
          path: development
      - name: Assemble static sites
        run: |
          mkdir -p site/preview
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' --exclude='/preview/' production/ site/
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' development/ site/preview/
          touch site/.nojekyll
          printf 'User-agent: *\nDisallow: /portfolio/preview/\n' > site/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
